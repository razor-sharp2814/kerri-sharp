name: Build PDF and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build PDF
        env:
          CHROME: google-chrome
        run: |
          ./build-pdf.sh --no-sandbox
          test -s kerri-sharp-cv.pdf

      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html kerri-sharp-cv.pdf fonts _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # A separate job, so the uploaded site is fully available before deploy looks for it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
